site_name: redsocks-transparent-proxy
site_description: 在中国大陆 Linux 服务器上做透明分流：非中国 TCP 走代理、中国 IP 直连、DNS 按域名分流。
site_url: https://chenxianlong.github.io/redsocks-transparent-proxy/
repo_url: https://github.com/chenxianlong/redsocks-transparent-proxy
repo_name: chenxianlong/redsocks-transparent-proxy
edit_uri: edit/main/docs/
copyright: MIT License · redsocks-transparent-proxy

docs_dir: docs

theme:
  name: material
  language: zh
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首页: index.md
  - 博客:
      - 移植到 Rocky Linux 10：踩穿三个坑: blog-rhel-transparent-proxy.md
  - 平台支持: platform-support.md
  - 性能: performance.md
  - GitHub: https://github.com/chenxianlong/redsocks-transparent-proxy
